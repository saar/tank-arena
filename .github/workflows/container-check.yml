# Check the container image on pull requests: build the small image (no AI) and see that the
# default command serves the browser version. Nothing is published. Guide: docs/CONTAINER.md
name: Container check

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - container/**
      - container.sh
      - tools/web/**
      - tools/web_build.sh
      - .github/workflows/container-check.yml

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image without the AI
        run: docker build -t tank-arena --build-arg WITH_AI=0 --build-arg MODEL_URL= .

      - name: The default command serves the browser version
        run: |
          docker run -d --name ta -p 127.0.0.1:8000:8000 tank-arena
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/ -o index.html && break; sleep 1; done
          docker logs ta
          grep -q "Tank Arena" index.html
          curl -sf -o /dev/null http://127.0.0.1:8000/web-src.apk
          docker rm -f ta

      - name: The game runs without a window
        run: docker run --rm tank-arena test
